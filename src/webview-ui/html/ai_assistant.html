<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/ai_assistant.css">
    <title>AI助手</title>
</head>
<body>
    <div class="ai-assistant-container">
        <div class="chat-header">
            <div class="header-left">
                <button id="configureApiKeyBtn" class="btn-secondary">配置API密钥</button>
                <div class="model-info">
                    <span>当前模型: </span>
                    <span id="currentModelDisplay" class="model-name">Qwen Turbo</span>
                </div>
            </div>
            <div class="header-actions">
                <!-- 模型选择框已移动到输入框下方 -->
            </div>
        </div>
        
        <div class="chat-container">
            <div id="chatMessages" class="chat-messages">
                <button id="clearHistoryBtn" class="clear-history-btn" title="清空历史">
                    <span class="clear-history-icon">🧹</span>
                </button>
            </div>
            
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        placeholder="输入您的问题..." 
                        rows="3"
                    ></textarea>
                    <div class="model-selector-bottom">
                        <select id="modelSelect" class="model-select">
                            <option value="qwen-max-latest" selected>qwen-max-latest</option>
                        </select>
                    </div>
                    <button id="sendButton" class="send-button">
                        <span>发送</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/ai_assistant.js"></script>
</body>
</html>
